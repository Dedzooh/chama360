services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: chama_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chama_management_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: chama_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application (for production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chama_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    profiles:
      - production

  # Development database (separate from production)
  postgres-dev:
    image: postgres:15-alpine
    container_name: chama_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: chama_management_system_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - development

  # Test database
  postgres-test:
    image: postgres:15-alpine
    container_name: chama_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: chama_management_system_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - test

volumes:
  postgres_data:
  postgres_dev_data:
  postgres_test_data:
  redis_data:

networks:
  default:
    name: chama_network
